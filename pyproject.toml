[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "svea-whisper"
version = "0.1.0"
description = "SveaWhisper: Whisper fine-tuned for Swedish — every dialect, every slang, on GPU, CPU and Android"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Training / evaluation stack (needs a real machine, ideally with a GPU)
train = [
    "torch>=2.2",
    "transformers>=4.44",
    "datasets>=2.20",
    "accelerate>=0.33",
    "evaluate>=0.4",
    "jiwer>=3.0",
    "soundfile>=0.12",
    "librosa>=0.10",
    "tensorboard>=2.16",
]
# Data collection & preprocessing
data = [
    "yt-dlp>=2024.8.6",
    "soundfile>=0.12",
    "librosa>=0.10",
    "torch>=2.2",          # for Silero VAD
]
# Export toolchain
export = [
    "ctranslate2>=4.3",
    "faster-whisper>=1.0",
    "onnx>=1.16",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
svea = "svea_whisper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
