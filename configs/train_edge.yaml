# EDGE model (phones, laptops, embedded): kb-whisper-small fine-tune.
# Exports to int8 CTranslate2 and q5_0 GGUF (~135MB) for on-device use.
# Hardware: 1× RTX 4090 / A10G is plenty.
base_model: KBLab/kb-whisper-small
train_manifests:
  - data/manifests/train_mix.jsonl  # built by `svea mix` (weighted)
eval_manifest: data/manifests/common_voice.test.jsonl
output_dir: runs/svea-edge
learning_rate: 1e-5
warmup_steps: 500
max_steps: 30000
per_device_batch_size: 32
gradient_accumulation: 1
eval_steps: 2000
save_steps: 2000
fp16: true
gradient_checkpointing: false
min_label_confidence: 0.6
