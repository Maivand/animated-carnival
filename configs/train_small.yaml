# CPU-deployment model: kb-whisper-small fine-tune.
# Hardware: 1× RTX 4090 / A10G is plenty.
base_model: KBLab/kb-whisper-small
train_manifests:
  - data/manifests/rixvox.train.jsonl
  - data/manifests/nst.train.jsonl
  - data/manifests/common_voice.train.jsonl
  - data/manifests/fleurs.train.jsonl
  - data/manifests/youtube.jsonl
eval_manifest: data/manifests/common_voice.test.jsonl
output_dir: runs/svea-small
learning_rate: 1e-5
warmup_steps: 500
max_steps: 30000
per_device_batch_size: 32
gradient_accumulation: 1
eval_steps: 2000
save_steps: 2000
fp16: true
gradient_checkpointing: false
min_label_confidence: 0.6
