# Stage 2 for the EDGE model: same slang/dialect specialization as the big
# model, applied to the small fine-tune. See train_large_stage2_slang.yaml
# for manifest preparation.
base_model: runs/svea-edge/final
train_manifests:
  - data/manifests/youtube_slang_dialect.jsonl
  - data/manifests/common_voice.train.jsonl
eval_manifest: data/manifests/common_voice.test.jsonl
output_dir: runs/svea-edge-slang
learning_rate: 3.0e-6
warmup_steps: 200
max_steps: 8000
per_device_batch_size: 32
gradient_accumulation: 1
eval_steps: 500
save_steps: 500
fp16: true
gradient_checkpointing: false
min_label_confidence: 0.75    # smaller model, stricter label hygiene
