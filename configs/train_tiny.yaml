# Ultra-light fallback / router experiments: kb-whisper-tiny fine-tune.
# The shipped products are svea-edge (train_edge.yaml) and svea-large
# (train_large.yaml + stage 2); tiny remains for very low-end devices and
# for validating data changes cheaply before an edge/large run.
base_model: KBLab/kb-whisper-tiny
train_manifests:
  - data/manifests/train_mix.jsonl  # built by `svea mix` (weighted)
eval_manifest: data/manifests/common_voice.test.jsonl
output_dir: runs/svea-tiny
learning_rate: 1.5e-5
warmup_steps: 500
max_steps: 30000
per_device_batch_size: 64
gradient_accumulation: 1
eval_steps: 2000
save_steps: 2000
fp16: true
gradient_checkpointing: false
min_label_confidence: 0.7   # tiny model is more sensitive to label noise
