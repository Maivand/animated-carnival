# Android-deployment model: kb-whisper-tiny fine-tune (quantized to ~30MB GGUF).
base_model: KBLab/kb-whisper-tiny
train_manifests:
  - data/manifests/rixvox.train.jsonl
  - data/manifests/nst.train.jsonl
  - data/manifests/common_voice.train.jsonl
  - data/manifests/fleurs.train.jsonl
  - data/manifests/youtube.jsonl
eval_manifest: data/manifests/common_voice.test.jsonl
output_dir: runs/svea-tiny
learning_rate: 1.5e-5
warmup_steps: 500
max_steps: 30000
per_device_batch_size: 64
gradient_accumulation: 1
eval_steps: 2000
save_steps: 2000
fp16: true
gradient_checkpointing: false
min_label_confidence: 0.7   # tiny model is more sensitive to label noise
